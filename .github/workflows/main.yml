
name: Build DEMON APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository files
        uses: actions/checkout@v4

      - name: List repository contents
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | head -200
          
